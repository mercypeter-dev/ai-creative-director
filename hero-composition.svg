<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="50%" stop-color="#F5EFEB"/>
      <stop offset="100%" stop-color="#EAE3D9"/>
    </linearGradient>

    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221C18"/>
      <stop offset="60%" stop-color="#342B25"/>
      <stop offset="100%" stop-color="#4A3B31"/>
    </linearGradient>

    <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#F0BF6C" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#D98A53" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D98A53" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientLighting" cx="50%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#F8DEB5" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#E2B883" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F5EFEB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E1B5"/>
      <stop offset="40%" stop-color="#C5A059"/>
      <stop offset="80%" stop-color="#9A7732"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>

    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C35B3F"/>
      <stop offset="100%" stop-color="#8F3922"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FBF4E6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="tableLinen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F2EBE1"/>
      <stop offset="100%" stop-color="#E4DCD0"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1712" flood-opacity="0.12"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="680" rx="28" fill="url(#canvasGrad)"/>
  <rect x="1.5" y="1.5" width="797" height="677" rx="26.5" fill="none" stroke="#E2D7C8" stroke-width="1.5"/>

  <!-- Subtle grid texture lines -->
  <path d="M 80,0 L 80,680 M 720,0 L 720,680 M 0,80 L 800,80 M 0,600 L 800,600" stroke="#E6DDCF" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Magazine Architectural Arch Window in Deep Espresso -->
  <g transform="translate(180, 50)" filter="url(#softShadow)">
    <path d="M 0,220 C 0,80 100,0 220,0 C 340,0 440,80 440,220 L 440,460 L 0,460 Z" fill="url(#archGrad)"/>
    <!-- Arch inner decorative border -->
    <path d="M 12,220 C 12,90 105,12 220,12 C 335,12 428,90 428,220 L 428,450 L 12,450 Z" fill="none" stroke="#C5A059" stroke-width="1" opacity="0.35"/>
    
    <!-- Moon / Celestial light inside arch -->
    <circle cx="220" cy="150" r="75" fill="#FFEFC7" opacity="0.08"/>
    <circle cx="220" cy="150" r="45" fill="#FFF8E7" opacity="0.12"/>
    <circle cx="220" cy="150" r="18" fill="#FFFCEE" opacity="0.25"/>

    <!-- Soft starry sparkles -->
    <circle cx="120" cy="110" r="1.5" fill="#FBF3E0" opacity="0.6"/>
    <circle cx="310" cy="90" r="1.5" fill="#FBF3E0" opacity="0.7"/>
    <circle cx="160" cy="190" r="1" fill="#FBF3E0" opacity="0.5"/>
    <circle cx="340" cy="180" r="1.2" fill="#FBF3E0" opacity="0.6"/>
    <circle cx="90" cy="240" r="1" fill="#FBF3E0" opacity="0.4"/>
    <circle cx="370" cy="230" r="1" fill="#FBF3E0" opacity="0.4"/>
  </g>

  <!-- Ambient Golden Room Light -->
  <circle cx="400" cy="410" r="280" fill="url(#ambientLighting)"/>

  <!-- Terracotta Artisanal Pedestal & Sculptural Elements -->
  <g transform="translate(130, 290)">
    <!-- Tall Terracotta Vessel -->
    <path d="M 15,160 Q 5,110 20,80 Q 25,60 20,20 L 45,20 Q 40,60 45,80 Q 60,110 50,160 Z" fill="url(#terraGrad)"/>
    <ellipse cx="32.5" cy="20" rx="12.5" ry="3.5" fill="#8F3922"/>
    
    <!-- Sculptural Olive / Eucalyptus Botanicals -->
    <path d="M 32,20 Q 15,-40 -20,-80" fill="none" stroke="#524339" stroke-width="2"/>
    <path d="M 32,15 Q 45,-30 65,-90" fill="none" stroke="#524339" stroke-width="2"/>
    <path d="M 32,10 Q 30,-50 15,-110" fill="none" stroke="#524339" stroke-width="1.8"/>
    
    <!-- Leaves in muted olive/champagne tones -->
    <ellipse cx="-18" cy="-80" rx="9" ry="5" transform="rotate(-30 -18 -80)" fill="#786A59"/>
    <ellipse cx="-6" cy="-55" rx="8" ry="4.5" transform="rotate(-20 -6 -55)" fill="#948574"/>
    <ellipse cx="6" cy="-30" rx="8" ry="4" transform="rotate(-15 6 -30)" fill="#786A59"/>
    
    <ellipse cx="65" cy="-90" rx="9" ry="5" transform="rotate(25 65 -90)" fill="#8A775E"/>
    <ellipse cx="50" cy="-60" rx="8" ry="4.5" transform="rotate(35 50 -60)" fill="#A89478"/>
    <ellipse cx="40" cy="-30" rx="7.5" ry="4" transform="rotate(20 40 -30)" fill="#786A59"/>

    <ellipse cx="15" cy="-110" rx="8" ry="4.5" transform="rotate(5 15 -110)" fill="#9A8973"/>
    <ellipse cx="23" cy="-75" rx="7" ry="4" transform="rotate(-10 23 -75)" fill="#786A59"/>
  </g>

  <!-- Candle 1 (Left Tall Brass Candlestick) -->
  <g transform="translate(240, 240)">
    <!-- Candle glow circle -->
    <circle cx="10" cy="-15" r="55" fill="url(#candleGlow)"/>
    <!-- Candlestick brass stem -->
    <rect x="8" y="50" width="4" height="150" fill="url(#goldLuster)"/>
    <path d="M 3,200 L 17,200 L 15,204 L 1,204 Z" fill="url(#goldLuster)"/>
    <ellipse cx="10" cy="50" rx="7" ry="2.5" fill="#C5A059"/>
    <!-- Wax candle column -->
    <rect x="7" y="-2" width="6" height="52" fill="#FAF6EE"/>
    <!-- Wick -->
    <line x1="10" y1="-2" x2="10" y2="-8" stroke="#33241C" stroke-width="1.5"/>
    <!-- Teardrop flame -->
    <path d="M 10,-24 C 6,-18 7,-10 10,-8 C 13,-10 14,-18 10,-24 Z" fill="#FFE699" filter="url(#subtleGlow)"/>
    <path d="M 10,-20 C 8.5,-16 9,-11 10,-9 C 11,-11 11.5,-16 10,-20 Z" fill="#FFFFFF"/>
  </g>

  <!-- Candle 2 (Right Center Medium Brass Candlestick) -->
  <g transform="translate(520, 260)">
    <circle cx="10" cy="-15" r="55" fill="url(#candleGlow)"/>
    <rect x="8" y="45" width="4" height="135" fill="url(#goldLuster)"/>
    <path d="M 3,180 L 17,180 L 15,184 L 1,184 Z" fill="url(#goldLuster)"/>
    <ellipse cx="10" cy="45" rx="7" ry="2.5" fill="#C5A059"/>
    <rect x="7" y="-2" width="6" height="47" fill="#FAF6EE"/>
    <line x1="10" y1="-2" x2="10" y2="-8" stroke="#33241C" stroke-width="1.5"/>
    <path d="M 10,-24 C 6,-18 7,-10 10,-8 C 13,-10 14,-18 10,-24 Z" fill="#FFE699" filter="url(#subtleGlow)"/>
    <path d="M 10,-20 C 8.5,-16 9,-11 10,-9 C 11,-11 11.5,-16 10,-20 Z" fill="#FFFFFF"/>
  </g>

  <!-- Candle 3 (Lower Accent Candlestick) -->
  <g transform="translate(360, 285)">
    <circle cx="10" cy="-15" r="45" fill="url(#candleGlow)"/>
    <rect x="8.5" y="40" width="3" height="110" fill="url(#goldLuster)"/>
    <ellipse cx="10" cy="40" rx="6" ry="2" fill="#C5A059"/>
    <rect x="7.5" y="0" width="5" height="40" fill="#FAF6EE"/>
    <line x1="10" y1="0" x2="10" y2="-6" stroke="#33241C" stroke-width="1.2"/>
    <path d="M 10,-20 C 7,-15 7.5,-8 10,-6 C 12.5,-8 13,-15 10,-20 Z" fill="#FFE699" filter="url(#subtleGlow)"/>
    <path d="M 10,-17 C 8.5,-13 9,-9 10,-8 C 11,-9 11.5,-13 10,-17 Z" fill="#FFFFFF"/>
  </g>

  <!-- Elegant Banquet Table Layer (Ivory & Sand Linen Drape) -->
  <g transform="translate(0, 395)" filter="url(#softShadow)">
    <!-- Base Table Horizon -->
    <path d="M 0,65 Q 400,35 800,65 L 800,285 L 0,285 Z" fill="url(#tableLinen)"/>
    <path d="M 0,65 Q 400,35 800,65" stroke="#D8CEBF" stroke-width="1.5" fill="none"/>

    <!-- Subtle Linen Drape Folds -->
    <path d="M 80,75 Q 120,180 140,285" stroke="#DDD3C4" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 280,68 Q 300,160 320,285" stroke="#DDD3C4" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 500,68 Q 480,170 470,285" stroke="#DDD3C4" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 680,75 Q 660,180 640,285" stroke="#DDD3C4" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Centerpiece Artisanal Ceramic Plate & Place Setting -->
    <g transform="translate(380, 50)">
      <!-- Main Charger plate -->
      <ellipse cx="20" cy="55" rx="80" ry="24" fill="#E8DFD3" stroke="#C5A059" stroke-width="1.5"/>
      <!-- Inner Dinner plate -->
      <ellipse cx="20" cy="53" rx="62" ry="18" fill="#F8F4EE" stroke="#DDD4C7" stroke-width="1"/>
      <!-- Small Salad plate -->
      <ellipse cx="20" cy="52" rx="42" ry="12" fill="#FBF9F5"/>
      <!-- Gold Rim accent -->
      <ellipse cx="20" cy="52" rx="40" ry="11.5" fill="none" stroke="#C5A059" stroke-width="0.8" opacity="0.7"/>

      <!-- Terracotta folded menu card -->
      <rect x="2" y="42" width="36" height="20" rx="2" transform="rotate(-8 20 52)" fill="#C35B3F" opacity="0.9"/>
      <line x1="6" y1="48" x2="32" y2="44" stroke="#FAF2EE" stroke-width="1" opacity="0.8"/>
      <line x1="8" y1="53" x2="28" y2="50" stroke="#FAF2EE" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Crystal Champagne Flute (Left) -->
    <g transform="translate(290, 15)">
      <!-- Base & Stem -->
      <ellipse cx="12" cy="78" rx="14" ry="4" fill="url(#glassGrad)" stroke="#B89035" stroke-width="0.8"/>
      <line x1="12" y1="78" x2="12" y2="40" stroke="#C5A059" stroke-width="1.5"/>
      <!-- Flute bowl -->
      <path d="M 4,5 Q 4,38 12,40 Q 20,38 20,5 Z" fill="url(#glassGrad)" stroke="#D4AF37" stroke-width="1"/>
      <!-- Champagne liquid -->
      <path d="M 5,16 Q 5,34 12,38 Q 19,34 19,16 Z" fill="#F4D99D" opacity="0.65"/>
      <!-- Effervescence tiny bubbles -->
      <circle cx="11" cy="22" r="0.8" fill="#FFFFFF"/>
      <circle cx="13" cy="28" r="0.9" fill="#FFFFFF"/>
      <circle cx="10" cy="32" r="0.7" fill="#FFFFFF"/>
      <!-- Glass rim -->
      <ellipse cx="12" cy="5" rx="8" ry="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>

    <!-- Wine Glass (Right) -->
    <g transform="translate(490, 22)">
      <ellipse cx="15" cy="72" rx="15" ry="4" fill="url(#glassGrad)" stroke="#B89035" stroke-width="0.8"/>
      <line x1="15" y1="72" x2="15" y2="38" stroke="#C5A059" stroke-width="1.5"/>
      <path d="M 3,6 Q 3,36 15,38 Q 27,36 27,6 Z" fill="url(#glassGrad)" stroke="#D4AF37" stroke-width="1"/>
      <path d="M 4.5,18 Q 4.5,33 15,36 Q 25.5,33 25.5,18 Z" fill="#D98A53" opacity="0.45"/>
      <ellipse cx="15" cy="6" rx="12" ry="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>

    <!-- Terracotta & Floral arrangement in center table -->
    <g transform="translate(190, 48)">
      <ellipse cx="25" cy="40" rx="35" ry="10" fill="#2E241E" opacity="0.12"/>
      <path d="M 10,40 Q 25,25 40,40 Z" fill="#B8583B"/>
      <!-- Dried floral elements -->
      <circle cx="18" cy="24" r="5" fill="#E6CE9F"/>
      <circle cx="32" cy="20" r="6" fill="#C5A059"/>
      <circle cx="25" cy="14" r="4.5" fill="#FAF4EB"/>
      <circle cx="12" cy="18" r="3.5" fill="#C35B3F"/>
      <circle cx="38" cy="27" r="4" fill="#8F3922"/>
    </g>
  </g>

  <!-- Editorial Magazine Badges & Overlays -->
  <!-- Top Right Floating Editorial Card -->
  <g transform="translate(510, 40)" filter="url(#softShadow)">
    <rect width="245" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.94"/>
    <rect width="245" height="110" rx="14" fill="none" stroke="#C5A059" stroke-width="1.2" opacity="0.5"/>
    
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#B89035" text-transform="uppercase">CURATED SALON · EDITORIAL</text>
    <text x="20" y="52" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="#1C1917">Bespoke Experience</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#78716C">Atmospheric Lighting &amp; Visual Direction</text>

    <!-- Color palette dots inside badge -->
    <g transform="translate(20, 84)">
      <circle cx="6" cy="6" r="6" fill="#FAF8F5" stroke="#DDD4C7" stroke-width="1"/>
      <circle cx="26" cy="6" r="6" fill="#C5A059"/>
      <circle cx="46" cy="6" r="6" fill="#1C1917"/>
      <circle cx="66" cy="6" r="6" fill="#EAE3D9"/>
      <circle cx="86" cy="6" r="6" fill="#B8583B"/>
      <text x="104" y="10" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#A8A29E">Bespoke Palette</text>
    </g>
  </g>

  <!-- Bottom Left Floating Editorial Card -->
  <g transform="translate(45, 520)" filter="url(#softShadow)">
    <rect width="260" height="92" rx="14" fill="#FAF8F5" fill-opacity="0.95"/>
    <rect width="260" height="92" rx="14" fill="none" stroke="#E2D7C8" stroke-width="1.2"/>
    
    <circle cx="36" cy="46" r="18" fill="#F8F3E5" stroke="#C5A059" stroke-width="1"/>
    <text x="36" y="51" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#B89035" text-anchor="middle">✦</text>

    <text x="68" y="38" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="600" fill="#1C1917">Creative Director Output</text>
    <text x="68" y="56" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#44403C">Concept · Palette · Budget · Execution</text>
    <text x="68" y="72" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5" fill="#B8583B">FEELS LIKE AN UNFORGETTABLE MOMENT</text>
  </g>

  <!-- Delicate Gold Foil Sparkles -->
  <g transform="translate(680, 240)">
    <path d="M 0,-10 L 2,-3 L 9,-2 L 4,3 L 6,10 L 0,5 L -6,10 L -4,3 L -9,-2 L -2,-3 Z" fill="#C5A059" opacity="0.85"/>
  </g>
  <g transform="translate(100, 180)">
    <path d="M 0,-8 L 1.5,-2.5 L 7,-1.5 L 3,2.5 L 4.5,8 L 0,4 L -4.5,8 L -3,2.5 L -7,-1.5 L -1.5,-2.5 Z" fill="#C5A059" opacity="0.75"/>
  </g>
</svg>
